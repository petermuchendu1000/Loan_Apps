<!doctype html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f9f3">
  <title>Apply online | Tala Kenya</title>
  <link rel="icon" href="/assets/tala-app-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/borrow.css">
  <link rel="stylesheet" href="/verify.css">
  <link rel="stylesheet" href="/application.css">
  <script type="module" src="/apply.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Tala Kenya home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-market">Kenya</span>
      </a>
      <nav class="portal-nav" aria-label="Application navigation">
        <a class="button button-header" href="https://tala.co.ke/contact/">Help</a>
      </nav>
    </div>
  </header>
  <main class="wrap portal verification" id="main">
    <div class="verification-layout">
      <section class="portal-heading">
        <p class="eyebrow"><span></span> Tala Kenya</p>
        <h1>Apply for credit.</h1>
        <p>Verify your account, tell us what you need, and track your application online.</p>
      </section>
      <section class="portal-card verification-card" id="application" aria-label="Credit application" aria-busy="true">
        <p role="status">Checking application availability…</p>
      </section>
    </div>
    <noscript><p>JavaScript is required to apply online.</p></noscript>
    <div class="portal-footer">
      <a href="https://tala.co.ke/privacy-policy-ke/">Tala privacy policy</a>
      <a href="https://tala.co.ke/contact/">Contact Tala support</a>
    </div>
  </main>
</body>
</html>
