<!doctype html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f9f3">
  <title>Online account | Tala Kenya</title>
  <link rel="icon" href="/assets/tala-app-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/borrow.css">
  <link rel="stylesheet" href="/verify.css">
  <script type="module" src="/auth.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Tala Kenya home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-market">Kenya</span>
      </a>
      <nav class="portal-nav" aria-label="Account navigation">
        <a class="button button-header" href="https://tala.co.ke/contact/">Help</a>
      </nav>
    </div>
  </header>
  <main class="wrap portal verification" id="main">
    <div class="verification-layout">
      <section class="portal-heading">
        <h1 id="account-heading">Your online account.</h1>
        <p id="account-description">Access your web application with your Kenyan mobile number.</p>
      </section>
      <section class="portal-card verification-card" id="account" aria-label="Online account" aria-busy="true">
        <p role="status">Checking account access…</p>
      </section>
    </div>
    <noscript><p>JavaScript is required to sign in to your online account.</p></noscript>
    <div class="portal-footer">
      <a href="https://tala.co.ke/privacy-policy-ke/">Tala privacy policy</a>
      <a href="https://tala.co.ke/faq/">Android account help</a>
    </div>
  </main>
</body>
</html>
